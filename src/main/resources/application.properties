spring.application.name=QuantityMeasurementApp

# DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/quantity_measurement_app
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Core Spring Boot JPA Options
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create

# Vendor-Specific Native Properties (Passed Directly to Hibernate)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.generate_statistics=true